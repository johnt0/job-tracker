services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-job_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    build: .
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://${POSTGRES_USER:-job_tracker}:${POSTGRES_PASSWORD:-job_tracker}@db:5432/${POSTGRES_DB:-job_tracker}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "migrate", "--noinput"]

  web:
    build: .
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://${POSTGRES_USER:-job_tracker}:${POSTGRES_PASSWORD:-job_tracker}@db:5432/${POSTGRES_DB:-job_tracker}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

volumes:
  pgdata:
